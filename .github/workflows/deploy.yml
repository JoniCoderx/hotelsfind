name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set these under Settings → Secrets and variables → Actions → Variables.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          PUBLIC_BOOKING_AID: ${{ vars.PUBLIC_BOOKING_AID }}
          PUBLIC_AGODA_CID: ${{ vars.PUBLIC_AGODA_CID }}
          PUBLIC_EXPEDIA_AFFCID: ${{ vars.PUBLIC_EXPEDIA_AFFCID }}
          PUBLIC_HOTELSCOM_AFFCID: ${{ vars.PUBLIC_HOTELSCOM_AFFCID }}
          PUBLIC_TRIP_ALLIANCE_ID: ${{ vars.PUBLIC_TRIP_ALLIANCE_ID }}
          PUBLIC_TRIP_SID: ${{ vars.PUBLIC_TRIP_SID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
