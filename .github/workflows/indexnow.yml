name: IndexNow

# After each push to main, wait for Vercel to serve that commit, then submit new or changed pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: indexnow

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the deploy
        if: github.event_name == 'push'
        timeout-minutes: 15
        run: until [ "$(curl -s https://malonzol.com/build.txt)" = "$GITHUB_SHA" ]; do sleep 15; done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The hashes of what was last submitted live in the Actions cache between runs.
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - run: node scripts/indexnow.mjs .indexnow-state.json
      - uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
